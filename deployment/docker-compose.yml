version: "3.9"

services:
  # ── FastAPI backend ───────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: xauusd-platform:latest
    container_name: xauusd_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - APP_ENV=production
    volumes:
      - ../logs:/app/logs
      - ../exports:/app/exports
      - ../live_logs:/app/live_logs
      - ../datasets:/app/datasets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - xauusd_net

  # ── Streamlit dashboard ───────────────────────────────────
  dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: xauusd-platform:latest
    container_name: xauusd_dashboard
    command: streamlit run frontend/app.py --server.port 8501 --server.headless true --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      - APP_ENV=production
    volumes:
      - ../logs:/app/logs
      - ../exports:/app/exports
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - xauusd_net

  # ── Nginx reverse proxy ───────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: xauusd_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../logs/nginx:/var/log/nginx
    depends_on:
      - api
      - dashboard
    restart: unless-stopped
    networks:
      - xauusd_net

  # ── Watchdog / monitoring ─────────────────────────────────
  watchdog:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: xauusd-platform:latest
    container_name: xauusd_watchdog
    command: python monitoring/watchdog.py
    env_file:
      - ../.env
    volumes:
      - ../logs:/app/logs
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - xauusd_net

networks:
  xauusd_net:
    driver: bridge

volumes:
  logs:
  exports:
